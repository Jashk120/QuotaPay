name: agent-worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "lib/dao/**"
      - "db/**"
      - "scripts/agent-migrate.mjs"
      - "deploy/agent-compose.yml"
      - ".github/workflows/agent-worker.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/jashk120/quotapay-agent-worker:latest

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 161.118.164.226
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/agent-compose.yml"
          target: "~/agent"
          strip_components: 1
      - name: Pull and restart worker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 161.118.164.226
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p ~/agent
            cd ~/agent
            mv -f agent-compose.yml docker-compose.yml
            # .env is managed on the box (mode 600), never overwritten by CI
            sudo docker compose pull agent-worker
            sudo docker compose up -d agent-worker
            sudo docker ps --filter name=agent-worker --format '{{.Names}} {{.Status}}'
