name: agent-worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "lib/dao/**"
      - "db/**"
      - "scripts/agent-migrate.mjs"
      - "deploy/agent-compose.yml"
      - ".github/workflows/agent-worker.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/jashk120/quotapay-agent-worker:latest

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}

  deploy:
    # Manual pull on the VPS (no SSH key in CI by design):
    #   cd ~/agent && sudo docker compose pull && sudo docker compose up -d
    # Kept as a no-op placeholder so the pipeline stays green without secrets.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploy is manual: pull ghcr.io/jashk120/quotapay-agent-worker:latest on oracle-vps"
